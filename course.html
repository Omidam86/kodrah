<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دوره | کدراه</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">کدراه</a>
      <nav class="nav">
        <a href="index.html">خانه</a>
        <a href="roadmaps.html" class="active">نقشه راه‌ها</a>
      </nav>
    </div>
  </header>

  <main class="container" id="course-root"></main>

  <!-- مودال خرید -->
  <div class="modal-overlay" id="buy-modal">
    <div class="modal">
      <h3>خرید دوره</h3>
      <p class="modal-sub">برای ثبت سفارش، روی دکمه زیر بزنید</p>

      <button class="platform-btn platform-btn-full" onclick="orderVia('telegram')">
        <span class="platform-icon">✈️</span>
        <span class="platform-name">سفارش از تلگرام</span>
        <span class="platform-hint">@OMIX777</span>
      </button>

      <div class="copy-note">
        <span class="copy-note-icon">📋</span>
        <p>
          متن سفارش <strong>به‌صورت خودکار در کلیپ‌بورد شما کپی می‌شود</strong>.
          فقط کافیه بعد از باز شدن تلگرام،
          متن آماده را برای آیدی <strong>@OMIX777</strong> ارسال کنید.
        </p>
      </div>

      <button class="modal-close" onclick="closeBuyModal()">انصراف</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">ساخته شده با ❤️ | کدراه © ۱۴۰۴</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
