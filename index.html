<script>
(function () {
  try {
    var saved = sessionStorage.getItem('kodrah_path');
    if (saved) {
      sessionStorage.removeItem('kodrah_path');
      history.replaceState(null, null, saved);
    }
    var theme = localStorage.getItem('kodrah-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
