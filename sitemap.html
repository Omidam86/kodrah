<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشه سایت | کدراه - تمام مسیرها و دوره‌ها</title>
<meta name="description" content="نقشه کامل سایت کدراه: تمام نقشه راه‌های برنامه‌نویسی، وب، شبکه و امنیت با لیست کامل دوره‌ها.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://kodrah.ir/sitemap.html">
<link rel="icon" type="image/x-icon" href="/logo.ico">
<link rel="shortcut icon" href="/logo.ico">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "کدراه",
  "url": "https://kodrah.ir/",
  "inLanguage": "fa-IR"
}
</script>
<style>
:root {
  --accent-3: #22d3ee;
  --spring: cubic-bezier(0.2, 0.9, 0.3, 1);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
html[data-theme="light"] {
  --bg: #f4f5f9; --text: #0d0e12; --text-soft: rgba(13,14,18,0.72); --text-mute: rgba(13,14,18,0.52);
  --card-bg: #ffffff;
  --card-border: rgba(13,14,18,0.08);
  --card-border-strong: rgba(13,14,18,0.14);
  --card-shadow: 0 8px 24px -14px rgba(31,41,55,0.15);
  --border-soft: rgba(13,14,18,0.06);
  --orb-1: #ec4899; --orb-2: #22d3ee; --orb-opacity: 0.35; --orb-blur: 130px;
}
html[data-theme="dark"] {
  --bg: #030305; --text: #ffffff; --text-soft: rgba(255,255,255,0.72); --text-mute: rgba(255,255,255,0.48);
  --card-bg: #0f1219;
  --card-border: rgba(255,255,255,0.08);
  --card-border-strong: rgba(255,255,255,0.16);
  --card-shadow: 0 8px 24px -14px rgba(0,0,0,0.7);
  --border-soft: rgba(255,255,255,0.06);
  --orb-1: #ec4899; --orb-2: #06b6d4; --orb-opacity: 0.5; --orb-blur: 110px;
}
* {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
*::-webkit-scrollbar { display: none; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8;
  min-height: 100vh; overflow-x: hidden; padding: 40px 20px;
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
  -webkit-overflow-scrolling: touch;
}
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(var(--orb-blur)); }
.orb.o1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--orb-1), transparent 70%); top: -150px; right: -150px; opacity: var(--orb-opacity); }
.orb.o2 { width: 600px; height: 600px; background: radial-gradient(circle, var(--orb-2), transparent 70%); bottom: -200px; left: -200px; opacity: var(--orb-opacity); }
.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; margin-bottom: 30px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 999px; color: var(--text-soft);
  text-decoration: none; font-size: 0.9rem; font-weight: 600;
  transition: all 0.3s var(--spring);
}
.back-link:hover { color: var(--text); transform: translateX(-4px); border-color: var(--card-border-strong); }
header.page-head {
  padding: 30px 32px; margin-bottom: 30px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  box-shadow: var(--card-shadow);
  text-align: center;
}
header.page-head h1 {
  font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800;
  letter-spacing: -0.03em; margin-bottom: 10px;
  background: linear-gradient(135deg, #ec4899, #22d3ee);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
header.page-head p { color: var(--text-soft); font-size: 1rem; }
.roadmap-block {
  padding: 28px; margin-bottom: 22px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  box-shadow: var(--card-shadow);
  transition: border-color 0.3s;
}
.roadmap-block:hover { border-color: var(--card-border-strong); }
.roadmap-block h2 {
  font-size: 1.3rem; font-weight: 800; margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 14px; border-bottom: 1px solid var(--border-soft);
}
.roadmap-block h2 a { color: inherit; text-decoration: none; transition: color 0.3s; }
.roadmap-block h2 a:hover { color: #ec4899; }
.section-group { margin-bottom: 20px; padding-right: 14px; border-right: 3px solid rgba(236,72,153,0.4); }
.section-group:last-child { margin-bottom: 0; }
.section-group h3 {
  font-size: 1.05rem; font-weight: 700; margin-bottom: 12px;
  color: var(--text); display: flex; align-items: center; gap: 8px;
}
.section-group h3 a { color: inherit; text-decoration: none; transition: color 0.3s; }
.section-group h3 a:hover { color: #ec4899; }
.section-group ul { list-style: none; padding-right: 4px; }
.section-group li { margin-bottom: 8px; padding-right: 18px; position: relative; }
.section-group li::before {
  content: ''; position: absolute; right: 0; top: 12px;
  width: 6px; height: 6px; border-radius: 50%;
  background: linear-gradient(135deg, #ec4899, #22d3ee);
}
.section-group li a {
  color: var(--text-soft); text-decoration: none; font-size: 0.94rem;
  transition: color 0.3s, padding 0.3s;
}
.section-group li a:hover { color: #ec4899; padding-right: 4px; }
.section-group li .price-tag { color: var(--text-mute); font-size: 0.82rem; margin-right: 6px; }
footer.page-foot {
  text-align: center; padding: 30px 0 20px;
  color: var(--text-mute); font-size: 0.88rem;
}
@media (max-width: 640px) {
  body { padding: 20px 14px; }
  header.page-head { padding: 24px 20px; }
  .roadmap-block { padding: 22px 18px; }
  .roadmap-block h2 { font-size: 1.1rem; }
  .section-group h3 { font-size: 0.98rem; }
}
</style>
</head>
<body>
<div class="ambient"><span class="orb o1"></span><span class="orb o2"></span></div>

<div class="container">
  <a href="/" class="back-link">← بازگشت به سایت</a>

  <header class="page-head">
    <h1>نقشه کامل سایت کدراه</h1>
    <p>لیست تمام نقشه راه‌ها، بخش‌ها و دوره‌های آموزشی</p>
  </header>

  <main id="sitemap-content"></main>

  <footer class="page-foot">
    ساخته شده با ❤️ | کدراه © ۱۴۰۵
  </footer>
</div>

<script src="/data.js"></script>
<script>
(function renderSitemap() {
  const container = document.getElementById('sitemap-content');
  if (typeof roadmaps === 'undefined') {
    container.innerHTML = '<p style="text-align:center;color:var(--text-mute)">داده‌ها بارگذاری نشد.</p>';
    return;
  }

  container.innerHTML = roadmaps.map(r => {
    const sectionsHtml = r.sections.map(sec => `
      <div class="section-group">
        <h3>
          <a href="/roadmaps/${r.slug}/${sec.slug}">
            ${sec.title} (${sec.courses.length} دوره)
          </a>
        </h3>
        <ul>
          ${sec.courses.map(c => `
            <li>
              <a href="/roadmaps/${r.slug}/${sec.slug}/${c.slug}">
                ${c.title}
              </a>
              <span class="price-tag">— ${c.price}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');

    const totalCourses = r.sections.reduce((s, sec) => s + sec.courses.length, 0);

    return `
      <div class="roadmap-block">
        <h2>
          <a href="/roadmaps/${r.slug}">
            ${r.icon} ${r.title} (${totalCourses} دوره)
          </a>
        </h2>
        ${sectionsHtml}
      </div>
    `;
  }).join('');
})();

(function initTheme() {
  try {
    const saved = localStorage.getItem('kodrah-theme');
    document.documentElement.setAttribute('data-theme', saved || 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
</body>
</html>
