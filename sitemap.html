<style>
/* ============ SITEMAP-SPECIFIC STYLES ============ */

.sitemap-intro {
  text-align: center;
  color: var(--text-2);
  font-size: 0.95rem;
  line-height: 1.75;
  max-width: 640px;
  margin: 0 auto 32px;
}

/* Block (each major section) */
.sitemap-block {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 24px;
  margin-bottom: 20px;
}
.sitemap-block--highlight {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent-soft), var(--bg-2));
}
.sitemap-block__title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.sitemap-block__icon {
  font-size: 1.4rem;
  line-height: 1;
  flex-shrink: 0;
}
.sitemap-block__title a {
  color: inherit;
  transition: color 0.2s var(--ease);
}
.sitemap-block__title a:hover {
  color: var(--accent);
}
.sitemap-block__desc {
  color: var(--text-2);
  font-size: 0.9rem;
  line-height: 1.75;
  margin-bottom: 16px;
}
.sitemap-block__cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 20px;
  border-radius: var(--r-md);
  background: var(--accent);
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s var(--ease);
}
.sitemap-block__cta:hover {
  background: var(--accent-2);
  transform: translateY(-1px);
}

/* Group (subcategory inside a block) */
.sitemap-group {
  margin-bottom: 20px;
  padding-right: 14px;
  border-right: 3px solid var(--accent-soft);
}
.sitemap-group:last-child {
  margin-bottom: 0;
}
.sitemap-group__title {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  color: var(--text);
}
.sitemap-group__title a {
  color: inherit;
  transition: color 0.2s var(--ease);
}
.sitemap-group__title a:hover {
  color: var(--accent);
}

/* List */
.sitemap-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.sitemap-item {
  padding: 8px 18px 8px 0;
  position: relative;
  margin-bottom: 2px;
}
.sitemap-item::before {
  content: '';
  position: absolute;
  right: 0;
  top: 15px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}
.sitemap-item a {
  color: var(--text-2);
  font-size: 0.9rem;
  transition: color 0.2s var(--ease), padding-right 0.2s var(--ease);
}
.sitemap-item a:hover {
  color: var(--accent);
  padding-right: 4px;
}
.sitemap-item__meta {
  color: var(--text-3);
  font-size: 0.78rem;
  margin-right: 6px;
}

/* Responsive */
@media (min-width: 640px) {
  .sitemap-intro {
    font-size: 1rem;
    margin-bottom: 40px;
  }
  .sitemap-block {
    padding: 28px;
    margin-bottom: 22px;
  }
  .sitemap-block__title {
    font-size: 1.3rem;
  }
  .sitemap-group__title {
    font-size: 1.05rem;
  }
}
</style>

<!-- ============ Scripts ============ -->
<script src="/data.js"></script>
<script src="/python/data.js"></script>
<script>
(function () {
  var container = document.getElementById('sitemap-content');
  if (!container) return;

  var blocks = [];

  /* ============ همکاری در تولید محتوا ============ */
  blocks.push(
    '<div class="sitemap-block sitemap-block--highlight">' +
      '<h2 class="sitemap-block__title">' +
        '<span class="sitemap-block__icon" aria-hidden="true">🤝</span>' +
        '<a href="https://kodrah.ir/collab/">همکاری در تولید محتوا</a>' +
      '</h2>' +
      '<p class="sitemap-block__desc">' +
        'اگر در زمینه آموزش برنامه‌نویسی فعالیت می‌کنید و دوره ویدیویی یا کتاب آموزشی تولید کرده‌اید، ' +
        'با کدراه همکاری کنید. بدون هیچ هزینه‌ای، محتوای شما در پلتفرم کدراه عرضه و فروخته می‌شود.' +
      '</p>' +
      '<a href="https://kodrah.ir/collab/" class="sitemap-block__cta">درخواست همکاری →</a>' +
    '</div>'
  );

  /* ============ تمرین‌های پایتون ============ */
  if (typeof pythonExercises !== 'undefined' && Array.isArray(pythonExercises) && pythonExercises.length) {
    var levels = ['مقدماتی', 'متوسط', 'پیشرفته'];
    var pythonHtml =
      '<div class="sitemap-block">' +
        '<h2 class="sitemap-block__title">' +
          '<span class="sitemap-block__icon" aria-hidden="true">🐍</span>' +
          '<a href="https://kodrah.ir/python/">تمرین‌های پایتون (' + pythonExercises.length + ' تمرین)</a>' +
        '</h2>';

    levels.forEach(function (level) {
      var list = pythonExercises.filter(function (e) { return e.level === level; });
      if (!list.length) return;

      pythonHtml +=
        '<div class="sitemap-group">' +
          '<h3 class="sitemap-group__title">سطح ' + level + ' (' + list.length + ' تمرین)</h3>' +
          '<ul class="sitemap-list">' +
            list.map(function (ex) {
              return (
                '<li class="sitemap-item">' +
                  '<a href="https://kodrah.ir/python/exercise.html?slug=' + encodeURIComponent(ex.slug) + '">' + ex.title + '</a>' +
                  '<span class="sitemap-item__meta">— ' + ex.category + '</span>' +
                '</li>'
              );
            }).join('') +
          '</ul>' +
        '</div>';
    });

    pythonHtml += '</div>';
    blocks.push(pythonHtml);
  }

  /* ============ نقشه راه‌ها ============ */
  if (typeof roadmaps !== 'undefined' && Array.isArray(roadmaps) && roadmaps.length) {
    roadmaps.forEach(function (r) {
      var sectionsHtml = r.sections.map(function (sec) {
        return (
          '<div class="sitemap-group">' +
            '<h3 class="sitemap-group__title">' +
              '<a href="https://kodrah.ir/roadmaps/' + r.slug + '/' + sec.slug + '">' +
                sec.title + ' (' + sec.courses.length + ' دوره)' +
              '</a>' +
            '</h3>' +
            '<ul class="sitemap-list">' +
              sec.courses.map(function (c) {
                return (
                  '<li class="sitemap-item">' +
                    '<a href="https://kodrah.ir/roadmaps/' + r.slug + '/' + sec.slug + '/' + c.slug + '">' + c.title + '</a>' +
                    '<span class="sitemap-item__meta">— ' + c.price + '</span>' +
                  '</li>'
                );
              }).join('') +
            '</ul>' +
          '</div>'
        );
      }).join('');

      var totalCourses = r.sections.reduce(function (sum, sec) { return sum + sec.courses.length; }, 0);

      blocks.push(
        '<div class="sitemap-block">' +
          '<h2 class="sitemap-block__title">' +
            '<span class="sitemap-block__icon" aria-hidden="true">' + r.icon + '</span>' +
            '<a href="https://kodrah.ir/roadmaps/' + r.slug + '">' +
              r.title + ' (' + totalCourses + ' دوره)' +
            '</a>' +
          '</h2>' +
          sectionsHtml +
        '</div>'
      );
    });
  }

  container.innerHTML = blocks.join('');
})();
</script>
